[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Reviewed 2026-10-13. Next review: 2027-01-13.
# Keep these only while current Tauri/wry transitive dependencies
# report them. Remove ignores once cargo-deny no longer reports the advisory
# without ignores, or upstream removes the affected dependency chain.
ignore = [
  "RUSTSEC-2024-0370", # tracked in #35; Tauri Linux GTK macros -> proc-macro-error
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  # keepass uses secstr for protected strings; secstr is Unlicense.
  { allow = ["Unlicense"], name = "secstr" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
