[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
  # Reviewed 2026-10-13. Reassess the Tauri Linux dependency in #35 by 2027-01-13.
  # Remove when Tauri's GTK macros stop depending on proc-macro-error.
  "RUSTSEC-2024-0370",
  # Reassess by 2027-01-13.
  { id = "RUSTSEC-2026-0543", reason = "Tracked in #322. KeePass uses chrono types in its vault timestamp API, and RustSec lists no patched release." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  # keepass uses secstr for protected strings; secstr is Unlicense.
  { allow = ["Unlicense"], name = "secstr" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
